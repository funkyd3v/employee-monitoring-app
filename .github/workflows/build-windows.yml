name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]          # e.g. v0.1.0 -> creates GitHub Release
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write         # needed for softprops/action-gh-release on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      # Optional: gate the build — remove if you want build even when lint fails
      - name: Lint / typecheck / tests (Windows providers installed)
        run: |
          uv run ruff check app tests
          uv run mypy app
          uv run pytest -q --ignore=tests --deselect="integration" -k "not ui" 2>&1 | head -n 100
        # Non-Windows extras like pynput/pywin32 are only installed on Windows
        # because pyproject.toml gates them with sys_platform == "win32"

      - name: Build EXE (PyInstaller --onedir, windowed)
        run: uv run pyinstaller installer/build.spec --noconfirm --clean

      - name: Verify bundle
        run: |
          dir dist\EmployeeMonitoring
          if (!(Test-Path "dist\EmployeeMonitoring\EmployeeMonitoring.exe")) { throw "EXE not found" }
          # A packaged build with no bundled .env silently resolves EM_MODE to
          # "local", refuses every real account, and reports it as a wrong
          # password. Fail the build here instead of shipping that.
          $bundled = "dist\EmployeeMonitoring\_internal\.env"
          if (!(Test-Path $bundled)) { throw "bundled .env not found - installer/build.spec must ship .env.example as .env" }
          # Must be the tracked template, byte for byte: proves the right file
          # was bundled and that nothing in the pipeline rewrote it.
          $a = (Get-FileHash ".env.example" -Algorithm SHA256).Hash
          $b = (Get-FileHash $bundled -Algorithm SHA256).Hash
          if ($a -ne $b) { throw "bundled .env does not match .env.example" }
          # ...and it must actually select api mode with a server to talk to.
          $envText = Get-Content $bundled -Raw
          if ($envText -notmatch "(?m)^EM_MODE=api\s*$") { throw "bundled .env must set EM_MODE=api" }
          if ($envText -notmatch "(?m)^EM_API_BASE_URL=\S+") { throw "bundled .env must set EM_API_BASE_URL" }
          # The bundled config ships inside a binary given to every employee.
          # It must carry no credential — active lines only, so the commented
          # documentation in the template is not mistaken for one.
          $active = ($envText -split "`n" | Where-Object { $_ -match '^\s*[A-Za-z_]' }) -join "`n"
          if ($active -match '(?i)(password|secret|token|api[_-]?key|bearer|credential)') {
            throw "bundled .env contains a credential-like setting; it would be shipped to every employee"
          }
          if ($envText -match '(?i)https?://[^/\s:@]+:[^/\s@]+@') {
            throw "bundled .env embeds a credential in EM_API_BASE_URL"
          }
          # A non-loopback host over http sends the password and the bearer
          # token in cleartext; the app refuses this at startup, so a build
          # that still does it is misconfigured.
          if ($envText -match '(?im)^EM_API_BASE_URL=http://(?!(127\.|localhost|\[?::1\]))') {
            throw "EM_API_BASE_URL uses http:// for a non-local host; use https://"
          }
          # The installer reads this exact path; a layout change must not slip through.
          if (-not (Select-String -Path "installer\installer.iss" -SimpleMatch "dist\EmployeeMonitoring\_internal\.env" -Quiet)) { throw "installer.iss no longer references the bundled .env path" }

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: installer/installer.iss
        # To pass version from git tag, use:
        #   options: /DMyAppVersion=${{ github.ref_name }}

      # Code signing (Authenticode) — uncomment when you have a cert:
      # - name: Build signed installer
      #   env:
      #     PFX_B64: ${{ secrets.WINDOWS_PFX_B64 }}
      #     PFX_PASS: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      #   run: |
      #     [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:PFX_B64))
      #     iscc /Ssigntool="signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f cert.pfx /p $env:PFX_PASS `$f" installer/installer.iss

      - name: Upload EXE bundle (onedir folder)
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeMonitoring-onedir-${{ github.sha }}
          path: dist/EmployeeMonitoring/
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeMonitoring-Setup-${{ github.sha }}
          path: installer/dist/*.exe
          if-no-files-found: warn

      # Auto-release on tag push (v*): attaches installer + zipped onedir
      - name: Zip onedir for Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist\EmployeeMonitoring -DestinationPath EmployeeMonitoring-${{ github.ref_name }}-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/dist/*.exe
            EmployeeMonitoring-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
