[project]
name = "employee-monitoring-agent"
version = "0.1.0"
description = "Windows desktop agent recording employee work-session activity (client-side, offline-first)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Runtime
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "APScheduler>=3.10,<4",
    "Pillow>=10.4",
    "mss>=9.0",
    "keyring>=25.4,<26",
    # Windows-only provider backends (skipped on non-Windows dev machines)
    "pynput>=1.7.6,<2 ; sys_platform == 'win32'",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "mypy>=1.11",
]

[project.scripts]
employee-monitoring-agent = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff (lint) ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # bandit (security)
    "PT",  # flake8-pytest-style
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PERF",# perflint
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific
]
ignore = [
    "COM812",  # trailing commas handled by formatter
    "S101",    # assert is fine in this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S105", # hardcoded password (dummy dev credentials)
    "S106", # hardcoded password argument (dummy dev credentials)
]
"app/infrastructure/system/**" = ["E501", "N806", "F841", "SIM105", "S110", "ARG001", "TC003", "RUF100"]
"app/main.py" = ["E501", "RUF100"]
"app/core/logging.py" = ["E501", "B009", "RUF100"]
"app/core/container.py" = ["N814", "RUF100"]

[tool.ruff.format]

# ── mypy (type checking) ───────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["app"]
exclude = ['\.venv/']

# ── pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: exercises repositories, filesystem, or provider backends (deselect with '-m \"not integration\"')",
    "ui: Qt widget / pytest-qt tests (deselect with '-m \"not ui\"')",
    "failure: failure-mode tests for workers and services",
]